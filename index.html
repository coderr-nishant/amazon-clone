<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon.in</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="navbar ">
            <div class="nav-logo border">
                <div class="logo">

                </div>
            </div>
            <div class="nav-address border">
                <p class="add-first">Deliver to</p>
                <div class="add-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <p class="add-second">India</p>
                </div>
            </div>
            <div class="nav-search">
                <select name="All" class="select">
                    <option value="All">All</option>
                </select>
                <input type="text" placeholder="Search Amazon" class="search">
                <div class="search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>
            <div class="language border">
                <div class="english">
                    <i class="fa-solid fa-flag-usa" ></i>
                    <select name="EN" class="ENG">
                        <option value="En" >En</option>
                    </select>
                </div>
            </div>
            <div class="Account border">
                <div class="Hello">
                    Hello,sign in
                </div>
                <div class="List">
                    Account & Lists
                    <select name="Account & Lists" class="Listing">
                     <option value="Account & Lists" ></option>
                    </select>
                </div>
            </div>
            <div class="nav-return border">
                <div class="Hello">
                    Returns
                </div>
                <div class="List">
                    & Orders
                </div>
            </div>
            <div class="nav-cart border">
                <i class="fa-solid fa-cart-shopping"></i>
                Cart
            </div>
        </div>
        <div class="panel">
            <div class="panel-all border" >
                <i class="fa-solid fa-bars"></i>
                All
            </div>
            <!--Panel -->
            <div class="panel-op">
                <p class="border">Today's Deal</p>
                <p class="border">Customer Service</p>
                <p class="border">Registry</p>
                <p class="border">Gift Card's</p>
                <p class="border">Sell</p>
            </div>
            <div class="panel-right">
                <p class="border">Shop deals in Mobiles</p>
            </div>
        </div>
    </header>
    <!--hero section -->
    <div class="hero">
        <div class="hero-message">
            <p>You are on amazon.com. You can also shop on Amazon India for million of products with fast local delivery. <a href="https://www.amazon.in/?tag=msndeskabkin-21&ref=pd_sl_1tmvcmz30t_e&adgrpid=1329311168025487&hvadid=83082281448403&hvnetw=o&hvqmt=e&hvbmt=be&hvdev=c&hvlocint=&hvlocphy=149073&hvtargid=kwd-83082829756950:loc-90&hydadcr=5650_2502654&mcid=6233a7c588f136ff9af0c63d9f6745bc&msclkid=f9e9ab6c558410bf4f03c1ff5513e278 ">Click here to go to amazon.in</a> </p>
        </div>
    </div>
</body>
</html>
